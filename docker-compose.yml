version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: societybuy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: societybuy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d societybuy"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: societybuy-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/societybuy?schema=public
      AUTH_SECRET: dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production
      PAYMENT_DEV_MODE: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
